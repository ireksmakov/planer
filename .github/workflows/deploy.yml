name: Deploy Planner to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare version manifest
        run: |
          mkdir -p public
          printf '{"version":"%s"}\n' "$GITHUB_SHA" > public/version.json
      - name: Build app
        env:
          VITE_APP_VERSION: ${{ github.sha }}
        run: npm run build
      - name: Setup Python for backend checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Planner API and reminder schedule
        run: |
          python -m pip install -r server/requirements.txt
          python -m compileall -q server
          python -m unittest server.test_reminders server.test_telegram_auth server.test_telegram_group
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
